<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="100%" stop-color="#0b0e14" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer App Rounded Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.4" />
  
  <!-- Trading Nodes & Candlestick Network -->
  <g opacity="0.25">
    <line x1="80" y1="256" x2="432" y2="256" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" />
    <line x1="256" y1="80" x2="256" y2="432" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="160" cy="200" r="6" fill="#10b981" />
    <circle cx="352" cy="160" r="6" fill="#f59e0b" />
    <circle cx="320" cy="340" r="6" fill="#ef4444" />
    <circle cx="180" cy="320" r="6" fill="#6366f1" />
    <line x1="160" y1="200" x2="352" y2="160" stroke="#10b981" stroke-width="2" opacity="0.6" />
    <line x1="352" y1="160" x2="320" y2="340" stroke="#f59e0b" stroke-width="2" opacity="0.6" />
  </g>
  
  <!-- Schevanka Gold Terminal Emblem "S" & Gold Bars -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal Node -->
    <polygon points="256,120 376,190 376,322 256,392 136,322 136,190" fill="#111622" stroke="url(#goldGrad)" stroke-width="8" />
    
    <!-- Dynamic Bullish Candlestick & Node Ribbon forming 'S' -->
    <path d="M 310 180 C 310 180, 240 160, 210 200 C 180 240, 310 270, 280 320 C 250 360, 190 340, 190 340" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Core Golden Node Core -->
    <circle cx="256" cy="256" r="28" fill="#0b0e14" stroke="url(#goldGrad)" stroke-width="6" />
    <circle cx="256" cy="256" r="14" fill="url(#goldGrad)" />
    
    <!-- Top & Bottom Signal Sparks -->
    <circle cx="256" cy="120" r="8" fill="#10b981" />
    <circle cx="256" cy="392" r="8" fill="#f59e0b" />
  </g>
  
  <!-- Terminal Text Subtitle -->
  <text x="256" y="445" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="4">SCHEVANKA</text>
  <text x="256" y="475" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="6">XAU/USD TERMINAL</text>
</svg>
